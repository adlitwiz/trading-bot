name: QSE Bot - Jalan Tiap 4 Jam

on:
  schedule:
    # Bybit candle 4H tutup jam 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
    # Kita jalan 5 menit setelahnya (cron pakai UTC) supaya candle sudah pasti tutup.
    - cron: "5 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}   # tombol "Run workflow" manual di tab Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
